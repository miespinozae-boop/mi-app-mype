<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .wordmark-nex { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .wordmark-data { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-weight: 500; }
      .tagline { font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Icon badge -->
  <rect x="8" y="24" width="152" height="152" rx="34" fill="#0E1B2E"/>

  <!-- ascending data nodes with connecting trend line -->
  <polyline points="52,142 88,116 124,80" fill="none" stroke="#00C2D1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- trend arrowhead extending from top node -->
  <path d="M124,80 L146,58 M146,58 L131,60 M146,58 L144,73" fill="none" stroke="#6C5CE7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes -->
  <circle cx="52" cy="142" r="8" fill="#F4F7FA"/>
  <circle cx="88" cy="116" r="8" fill="#F4F7FA"/>
  <circle cx="124" cy="80" r="9" fill="#6C5CE7"/>

  <!-- Wordmark -->
  <text x="192" y="118" font-size="66">
    <tspan class="wordmark-nex" fill="#0E1B2E">Nex</tspan><tspan class="wordmark-data" fill="#00A3AF">Data</tspan>
  </text>

  <!-- Tagline -->
  <text x="194" y="150" font-size="20" class="tagline" fill="#6B7686">Datos claros para tu negocio</text>
</svg>
